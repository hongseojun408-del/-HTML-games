<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>효수쌤의 살아남기 시뮬레이터</title>
<style>
:root{--bg:#e8ebf2;--panel:#fff;--ink:#1a2030;--mut:#5d6783;--line:#c9cfdd;--acc:#e8590c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1117;--panel:#1a2030;--ink:#eef1f8;--mut:#929bb5;--line:#2e3650;--acc:#ff8a3d}}
:root[data-theme="dark"]{--bg:#0e1117;--panel:#1a2030;--ink:#eef1f8;--mut:#929bb5;--line:#2e3650;--acc:#ff8a3d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:900;letter-spacing:-.5px}
.stats{display:flex;gap:8px;font-weight:800}.stats span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
#st{color:var(--mut);font-size:13px;margin:6px 0;min-height:18px}
.cw{border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#0c1020}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;image-rendering:pixelated}
#mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:8px 0}
.mat{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:6px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.mat i{width:100%;height:10px;border-radius:3px;background:var(--c)}.mat b{font-size:13px}.mat small{font-size:11px;color:var(--mut)}
.mat.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.mat.lock{opacity:.5}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:700;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}button.on{border-color:var(--acc)}button:focus-visible{outline:3px solid var(--acc)}
button.go{background:var(--acc);color:#fff;border-color:var(--acc);margin-left:auto;font-size:16px;padding:8px 22px}
label{font-size:13px;color:var(--mut)}
.run .tools,.end .tools{opacity:.35;pointer-events:none}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.75);z-index:9;padding:16px;overflow:auto}
#ov[hidden]{display:none}
#box{background:var(--panel);border-radius:16px;padding:18px;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 60px #000a}
.big{font-size:26px;font-weight:900;margin:4px 0}.btns{display:flex;gap:8px;justify-content:center;margin-top:12px}
.btns button:last-child{background:var(--acc);color:#fff;border-color:var(--acc)}
.it{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);text-align:left}.it i{width:18px;height:18px;border-radius:4px;flex:none}.it b{flex:1}.it span{font-size:12px;color:var(--mut)}.it button{padding:5px 8px;font-size:12px}
.pic{position:relative;width:min(68vw,290px);margin:6px auto 12px;animation:pop .6s cubic-bezier(.2,1.7,.4,1) both,shk .1s .6s infinite}
.pic img{width:100%;display:block;border-radius:20px;border:4px solid #ff3b3b;box-shadow:0 0 50px #f00;filter:saturate(1.6) contrast(1.15)}
.pic::after{content:"";position:absolute;inset:0;border-radius:20px;background:#f00;mix-blend-mode:multiply;animation:pl .4s infinite alternate}
.pic em{position:absolute;font-size:46px;font-style:normal;z-index:2;animation:pl .3s infinite alternate}.v1{top:-14px;right:-10px}.v2{top:20px;left:-16px}
.bub{background:#fff;color:#c00;font-weight:900;font-size:19px;border-radius:14px;padding:10px 14px;border:3px solid #c00}
@keyframes pop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1)}}
@keyframes shk{0%{transform:translate(3px,1px) rotate(-1.5deg)}50%{transform:translate(-3px,-1px) rotate(1.5deg)}100%{transform:translate(1px,-3px)}}
@keyframes pl{from{opacity:.25}to{opacity:.65}}
@media (prefers-reduced-motion:reduce){.pic,.pic::after,.pic em{animation:none}}
</style></head><body>
<div id="app">
<header><h1>🔥 효수쌤의 살아남기 시뮬레이터 <small style="font-size:12px;color:var(--mut)">☣️ 산성비 + 👽 할머니 업데이트</small></h1><div class="stats"><span id="stg"></span><span id="mon"></span></div></header>
<div id="st"></div>
<div class="cw"><canvas id="c"></canvas></div>
<div id="mats" class="tools"></div>
<div class="row"><span class="row tools"><button id="bE">🧽 지우개</button><button id="bC">🧍 효수쌤 위치</button><label>붓 크기 <input type="range" id="bs" min="1" max="8" value="3"></label><button id="bR">🗑 초기화</button><button id="bShop">🛒 상점</button></span><button id="bSp" hidden>⏩ x1</button><button id="bGo" class="go">▶ 시작하기</button></div>
</div>
<div id="ov" hidden><div id="box"></div></div>

 fx.push({x:X0,y:Y0,r:6});shake=45;wf=1;
 if(Math.hypot(X0-(ch.x+ch.w/2),Y0-(ch.y+ch.h/2))<20)die('g')}
function tick(){t++;while(plan.length&&plan[0]<=t)spawn();
 raining=false;for(let i=storms.length-1;i>=0;i--){const s=storms[i];if(t>=s.e){storms.splice(i,1);continue}if(t>=s.s){raining=true;rain(s.r)}}
 while(gplan.length&&gplan[0]<=t)spawnG();updG();updM();
 if(!dead){chStep();if(!plan.length&&!ms.length&&!gplan.length&&!gr&&!storms.length&&++calm>150)win()}}
function drawChar(){
 const cx=(ch.x+ch.w/2)*S,top=ch.y*S;ctx.strokeStyle='#f4d58d';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();
 ctx.moveTo(cx,top+20);ctx.lineTo(cx,top+34);ctx.moveTo(cx-8,top+27);ctx.lineTo(cx,top+23);ctx.lineTo(cx+8,top+27);
 ctx.moveTo(cx,top+34);ctx.lineTo(cx-6,top+43);ctx.moveTo(cx,top+34);ctx.lineTo(cx+6,top+43);ctx.stroke();
 ctx.save();ctx.beginPath();ctx.arc(cx,top+11,11,0,7);ctx.clip();
 if(face.complete&&face.naturalWidth)ctx.drawImage(face,0,face.naturalHeight*.02,face.naturalWidth,face.naturalWidth,cx-11,top,22,22);ctx.restore();
 ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,top+11,11,0,7);ctx.stroke();
 if(phase==='run'&&!dead&&ms.some(m=>Math.hypot(m.x-ch.x,m.y-ch.y)<28)){ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('😱',cx,top-4)}
}
function drawFX(){
 if(raining){ctx.fillStyle='rgba(90,255,90,.06)';ctx.fillRect(0,0,W*S,H*S);const gd=ctx.createLinearGradient(0,0,0,70);gd.addColorStop(0,'rgba(60,160,40,.55)');gd.addColorStop(1,'rgba(60,160,40,0)');ctx.fillStyle=gd;ctx.fillRect(0,0,W*S,70);
  ctx.fillStyle='rgba(30,90,30,.55)';for(let i=0;i<7;i++){const cx=((i*140+fr*.3)%(W*S+160))-80;ctx.beginPath();ctx.ellipse(cx,14+(i%3)*6,70,16,0,0,7);ctx.fill()}}
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.r+=7;if(f.r>140){fx.splice(i,1);continue}const a=1-f.r/140;ctx.strokeStyle='rgba(180,255,150,'+a+')';ctx.lineWidth=1+7*a;ctx.beginPath();ctx.arc(f.x*S,f.y*S,f.r,0,7);ctx.stroke()}
 if(gr){const s=gr;ctx.save();ctx.translate(s.x*S,s.y*S);ctx.rotate(s.ang);
  const ag=ctx.createRadialGradient(0,0,6,0,0,62);ag.addColorStop(0,'rgba(140,255,110,.55)');ag.addColorStop(1,'rgba(140,255,110,0)');ctx.fillStyle=ag;ctx.beginPath();ctx.arc(0,0,62,0,7);ctx.fill();
  if(gface.complete&&gface.naturalWidth)ctx.drawImage(gface,-38,-39,76,78);else{ctx.font='60px sans-serif';ctx.textAlign='center';ctx.fillText('👵',0,20)}
  ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(0,72);ctx.lineTo(0,27);ctx.quadraticCurveTo(0,17,8,17);ctx.quadraticCurveTo(15,17,15,24);
  ctx.strokeStyle='#2b1808';ctx.lineWidth=8;ctx.stroke();ctx.strokeStyle='#b9772f';ctx.lineWidth=4.5;ctx.stroke();ctx.restore()}
 ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#000';
 if(gr&&!dead){ctx.font='900 22px sans-serif';ctx.fillStyle=(fr>>3)&1?'#ff3b3b':'#ffe14d';ctx.strokeText('⚠ 이혜선 할머니 접근 중!! 👽',W*S/2,34);ctx.fillText('⚠ 이혜선 할머니 접근 중!! 👽',W*S/2,34)}
 if(raining){ctx.font='900 18px sans-serif';ctx.fillStyle='#8dff6a';const y=gr?60:34;ctx.strokeText('☣️ 산성비 경보!',W*S/2,y);ctx.fillText('☣️ 산성비 경보!',W*S/2,y)}
}
function render(){
 const build=phase==='build';if(build)cnt.fill(0);
 for(let y=0,k=0;y<H;y++){const sr=12+y*.15,sg=16+y*.2,sb=38+y*.35;
  for(let x=0;x<W;x++,k++){const t=g[k],o=k*4;
   if(build&&t&&t<9)cnt[t]++;
   if(!t||t===13){pd[o]=sr;pd[o+1]=sg;pd[o+2]=sb}
   else{const c=COL[t],v=t===10||t===11||t===14?R()*60-30:((k*2654435761>>>0)%20)-10;pd[o]=c[0]+v;pd[o+1]=c[1]+v;pd[o+2]=c[2]+v}
   pd[o+3]=255}}
 octx.putImageData(idt,0,0);
 ctx.save();if(shake>.3){ctx.translate((R()-.5)*shake,(R()-.5)*shake);shake*=.9}
 ctx.imageSmoothingEnabled=false;ctx.drawImage(off,0,0,W*S,H*S);
 for(const m of ms){const n=m.tr.length;for(let i=0;i<n;i++){ctx.globalAlpha=i/n*.5;ctx.fillStyle='#ff9a3c';ctx.beginPath();ctx.arc(m.tr[i][0]*S,m.tr[i][1]*S,m.r*S*i/n,0,7);ctx.fill()}
  ctx.globalAlpha=1;const gr=ctx.createRadialGradient(m.x*S,m.y*S,0,m.x*S,m.y*S,m.r*S*1.8);gr.addColorStop(0,'#fff');gr.addColorStop(.35,'#ffb347');gr.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(m.x*S,m.y*S,m.r*S*1.8,0,7);ctx.fill()}
 pa=pa.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;return --p.l>0});for(const p of pa){ctx.fillStyle=p.c;ctx.fillRect(p.x*S,p.y*S,S*.8,S*.8)}
 drawChar();drawFX();
 if(build&&hover&&mode!=='char'){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(mx*S,my*S,brush*S,0,7);ctx.stroke()}
 ctx.restore();
 if(flash>0){ctx.fillStyle='rgba(255,0,0,'+flash*.5+')';ctx.fillRect(0,0,W*S,H*S);flash-=.02}
 if(wf>0){ctx.fillStyle='rgba(255,255,255,'+wf*.8+')';ctx.fillRect(0,0,W*S,H*S);wf-=.06}
}
function pos(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*W;my=(e.clientY-r.top)/r.height*H}
function act(){
 if(phase!=='build')return;
 if(mode==='char'){putChar(Math.round(mx-ch.w/2),Math.round(my-ch.h/2));return}
 const cx=Math.round(mx),cy=Math.round(my);
 for(let dy=-brush;dy<=brush;dy++)for(let dx=-brush;dx<=brush;dx++){
  if(dx*dx+dy*dy>brush*brush)continue;const X=cx+dx,Y=cy+dy;if(X<0||X>=W||Y<0||Y>=H)continue;const k=Y*W+X;
  if(mode==='erase'){if(g[k]&&g[k]!==13)g[k]=0}
  else if(g[k]===0&&cnt[sel]<cap(sel)){g[k]=sel;cnt[sel]++}}
}
cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);pos(e);act()};
cv.onpointermove=e=>{pos(e);hover=true;if(down)act()};
cv.onpointerup=cv.onpointercancel=()=>down=false;cv.onpointerleave=()=>hover=false;
function hud(){$('stg').textContent='STAGE '+P.stage;$('mon').textContent='💰 '+P.money}
function setSt(s){$('st').textContent=s}
function buildBar(){
 if(!avail(sel))sel=1;const b=$('mats');b.innerHTML='';
 for(let i=1;i<=8;i++){const m=M[i],ok=avail(i),e=document.createElement('button');
  e.className='mat'+(sel===i&&mode==='mat'?' on':'')+(ok?'':' lock');e.style.setProperty('--c','rgb('+m.c+')');
  e.innerHTML='<i></i><b>'+m.n+'</b><small id="r'+i+'">'+(ok?'':m.p&&P.stage>=m.u?'🛒 상점':'🔒 '+m.u+'단계')+'</small>';
  e.onclick=()=>{if(!ok){if(m.p&&P.stage>=m.u)shop();else setSt('🔒 '+m.u+'단계를 클리어하면 열려요.');return}sel=i;mode='mat';buildBar()};b.append(e)}
 $('bE').classList.toggle('on',mode==='erase');$('bC').classList.toggle('on',mode==='char');
}
function updR(){if(phase!=='build')return;for(let i=1;i<=8;i++)if(avail(i)){const e=$('r'+i);if(e)e.textContent='남음 '+Math.max(0,cap(i)-cnt[i])}}
$('bE').onclick=()=>{mode=mode==='erase'?'mat':'erase';buildBar()};
$('bC').onclick=()=>{mode=mode==='char'?'mat':'char';buildBar();if(mode==='char')setSt('🧍 원하는 곳을 눌러 효수쌤을 세우세요. 주변 칸은 비워져요.')};
$('bs').oninput=e=>brush=+e.target.value;
$('bR').onclick=()=>{if(phase==='build'){ground();stand()}};
$('bShop').onclick=shop;$('bGo').onclick=go;
$('bSp').onclick=()=>{spd=spd%3+1;$('bSp').textContent='⏩ x'+spd};
function go(){
 if(phase!=='build')return;snap=g.slice();snapCh={x:ch.x,y:ch.y};phase='run';dead=false;t=0;calm=0;ms=[];pa=[];
 const n=P.stage;total=(16+2*n)*60;plan=Array.from({length:3+3*n},()=>R()*total).sort((a,b)=>a-b);
 storms=[];gplan=[];gr=null;fx=[];raining=false;hadG=0;hadR=0;cause='';
 if(n>=2){const c=Math.min(3,1+Math.floor((n-2)/3));for(let i=0;i<c;i++){const s=total*(.08+.7*R());storms.push({s,e:s+(5+4*R())*60,r:Math.min(2.2,.9+.1*n)})}hadR=1}
 if(n>=2){const c=n>=5?3:n>=3?2:1;gplan=Array.from({length:c},(_,i)=>total*(.25+.6*(i+R())/c));hadG=c}
 $('app').className='run';$('bSp').hidden=false;$('bGo').hidden=true;
}
function toBuild(){
 if(snap){g.set(snap);ch.x=snapCh.x;ch.y=snapCh.y}ms=[];pa=[];gr=null;fx=[];storms=[];gplan=[];raining=false;dead=false;phase='build';spd=1;$('bSp').textContent='⏩ x1';
 $('app').className='';$('bSp').hidden=true;$('bGo').hidden=false;closeOv();buildBar();
 setSt('🛠 재료를 골라 벙커를 짓고 ‘효수쌤 위치’를 정한 뒤 시작하세요. 나무는 불에 타니 효수쌤과 떨어뜨려 두세요.'+buildNote());
}
function buildNote(){return(P.stage>=2?' ☣️ 산성비: 모래·흙·나무는 빨리, 콘크리트·금속은 천천히 녹고 돌·흑요석은 안 녹아요. 물은 산을 중화해요!':'')+(P.stage>=2?' 👽 이혜선 할머니가 쾅! 효수쌤 머리 위를 두껍게 쌓으세요.':'')}
function endMsg(){const m=cause==='a'?['으아아악!!! 산성비에 내 벙커가 녹았잖아!!!','☣️ 누가 하늘에 식초를 뿌렸어?! 💢']:cause==='g'?['저... 저 외계인 할머니는 뭐야?!?!','👽 이혜선 할머니가 날아와서 쾅!!! 💢']:['으아아아악!!! 내 벙커가!!!','누가 감히 나를 맞혀?! 💢'];
 return '<div class="bub">'+m[0]+'<br>'+m[1]+'</div>'+(cause==='g'?'<img src="'+GIMG+'" alt="이혜선 할머니" style="width:96px;margin-top:8px">':'')}
function winNote(){let s='';if(hadG)s+='<p>👽 이혜선 할머니의 습격까지 버텨냈어요!</p>';if(hadR)s+='<p>☣️ 산성비도 견뎠어요!</p>';
 if(P.stage===2)s+='<p><b>⚠ 다음 단계부터 초록 산성비가 내리고, 이혜선 할머니도 날아와요! 물은 산을 중화해요.</b></p>';
 return s}
function ov(h){$('box').innerHTML=h;$('ov').hidden=false}
function closeOv(){$('ov').hidden=true}
function showEnd(){
 phase='end';$('app').className='end';const rew=Math.floor((100+60*P.stage)*.3*Math.min(1,t/total));P.money+=rew;save();hud();
 ov('<div class="pic"><img src="'+IMG+'" alt="화난 효수쌤"><em class="v1">💢</em><em class="v2">💢</em></div>'+endMsg()+'<p>STAGE '+P.stage+' 실패 · 위로금 +'+rew+'💰</p><div class="btns"><button onclick="shop()">상점</button><button onclick="toBuild()">다시 도전</button></div>');
}
function win(){
 phase='end';$('app').className='end';const rew=100+60*P.stage,old=P.stage;P.money+=rew;P.stage++;save();hud();let un='';
 for(let i=1;i<=8;i++)if(M[i].u===P.stage)un+='<li>'+(M[i].p?'🛒 상점에 “'+M[i].n+'” 입고!':'🔓 새 물질 “'+M[i].n+'” 해금!')+'</li>';
 ov('<h2>🎉 STAGE '+old+' 생존 성공!</h2><p class="big">+'+rew+' 💰</p>'+(un?'<ul style="text-align:left">'+un+'</ul>':'')+winNote()+'<p>다음 단계는 운석이 더 많이, 더 크게 떨어져요.</p><div class="btns"><button onclick="shop()">상점</button><button onclick="toBuild()">다음 단계 준비</button></div>');
}
function shop(){
 if(phase==='end')toBuild();
 let h='<h2 style="margin:0">🛒 상점</h2><p class="big">💰 '+P.money+'</p>';
 for(let i=1;i<=8;i++){const m=M[i];let a;
  if(P.stage<m.u)a='<span>🔒 '+m.u+'단계 클리어 시 열림</span>';
  else if(!avail(i))a='<button '+(P.money<m.p?'disabled':'')+' onclick="buy('+i+')">구매 '+m.p+'💰</button>';
  else a='<span>한도 '+cap(i)+'</span><button '+(P.money<ucost(i)?'disabled':'')+' onclick="upg('+i+')">+'+m.st+' 한도 '+ucost(i)+'💰</button>';
  h+='<div class="it"><i style="background:rgb('+m.c+')"></i><b>'+m.n+'</b>'+a+'</div>'}
 ov(h+'<div class="btns"><button onclick="closeOv()">닫기</button></div>');
}
function fin(){save();hud();buildBar();shop()}
function buy(i){if(P.money<M[i].p)return;P.money-=M[i].p;P.own[i]=1;fin()}
function upg(i){const c=ucost(i);if(P.money<c)return;P.money-=c;P.lv[i]=(P.lv[i]||0)+1;fin()}
function loop(){
 requestAnimationFrame(loop);fr++;
 if(phase==='build')step();else if(phase==='run')for(let s=0;s<spd;s++){step();tick()}
 render();
 if(fr%6===0){updR();if(phase==='run'&&!dead)setSt((raining?'☣️ 산성비 경보! ':'')+(gr?'👽 이혜선 할머니 접근!! ':'')+'☄️ 남은 운석 '+(plan.length+ms.length)+'개 · 제발 살아남아요!')}
}
ground();stand();hud();toBuild();loop();
</script></body></html>
