<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎁 효수쌤 살아남기 기프트카드 10,000코인</title>
<style>
:root{--bg:#10131c;--tx:#f2f4fa;--mut:#9aa3b8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#2a1f4d,var(--bg));color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:20px}
.card{width:min(420px,100%);border-radius:22px;padding:26px;background:linear-gradient(135deg,#ffb347,#ff5e7e 55%,#7b4dff);box-shadow:0 20px 50px rgba(0,0,0,.5);position:relative;overflow:hidden;color:#fff}
.card:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.25),transparent 30%);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card>*{position:relative}
h1{margin:0 0 4px;font-size:15px;letter-spacing:.5px;opacity:.9}
.amt{font-size:52px;font-weight:900;margin:8px 0 2px;text-shadow:0 3px 10px rgba(0,0,0,.35)}
.sub{font-size:14px;opacity:.95;margin-bottom:18px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:2px;background:rgba(0,0,0,.3);border-radius:12px;padding:12px;text-align:center;user-select:all}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;background:#fff;color:#c2185b}
button:disabled{opacity:.55;cursor:default}
.msg{margin-top:14px;min-height:44px;font-size:14px;line-height:1.5;text-align:center;background:rgba(0,0,0,.28);border-radius:12px;padding:10px}
.note{margin-top:14px;font-size:12px;color:var(--mut);text-align:center;max-width:420px;line-height:1.5}
</style></head><body>
<div>
<div class="card">
 <h1>🔥 효수쌤의 살아남기 시뮬레이터 · GIFT CARD</h1>
 <div class="amt">💰 10,000</div>
 <div class="sub">코인 · 1회용 · 재사용 불가</div>
 <div class="code" id="code">HSQ-7UAC-XLUT-XKWW</div>
 <button id="go">🎁 코인 받기</button>
 <div class="msg" id="msg">버튼을 누르면 게임 잔액에 10,000코인이 들어가요.</div>
</div>
<p class="note">게임이 열려 있으면 먼저 닫고 사용하세요. 사용 후 게임을 새로고침하면 잔액이 반영돼요. 게임 파일과 같은 브라우저에서 열어야 해요.</p>
</div>
<script>
const CODE='HSQ-7UAC-XLUT-XKWW',AMOUNT=10000,KEY='hsq1',USED='hsq_gift_used';
const $=id=>document.getElementById(id);
function used(){try{return JSON.parse(localStorage.getItem(USED)||'[]')}catch(e){return[]}}
function lock(t){$('go').disabled=true;$('go').textContent=t}
if(used().includes(CODE)){lock('✅ 이미 사용된 카드');$('msg').textContent='이 기프트카드는 이미 사용되어 다시 쓸 수 없어요.'}
$('go').onclick=()=>{
 try{
  if(used().includes(CODE)){lock('✅ 이미 사용된 카드');return}
  let P={};try{P=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){P={}}
  if(typeof P.money!=='number')P.money=0;
  P.money+=AMOUNT;
  localStorage.setItem(KEY,JSON.stringify(P));
  const u=used();u.push(CODE);localStorage.setItem(USED,JSON.stringify(u));
  lock('✅ 사용 완료');
  $('msg').innerHTML='🎉 <b>+'+AMOUNT.toLocaleString()+'코인</b> 충전 완료!<br>현재 잔액: <b>'+P.money.toLocaleString()+'</b> 코인<br>게임을 새로고침하면 반영돼요.';
 }catch(e){$('msg').textContent='⚠ 저장에 실패했어요. 게임과 같은 브라우저인지, 시크릿 모드가 아닌지 확인해주세요.'}
};
</script></body></html>
